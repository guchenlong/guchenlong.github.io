<!DOCTYPE html>
<html>

<head>
    <title>图形库 | 顾晨龙的个人网站</title>
    <meta name="keywords" content="图形库" />
    <meta name="description" content="图形库 | 顾晨龙的个人网站" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./index.css" />
    <script src="../common/js/common.js"></script>
</head>

<body>
    <header>
        <div class="header-item">
            <a href="/" target="_blank">顾晨龙的个人网站</a>
        </div>
        <div class="header-item">图形库</div>
    </header>
    <main>
        <article>
            <!-- 平面图形 -->
            <section class="article-section">
                <div class="article-section-title">平面图形</div>
                <div class="article-section-list">
                    <!-- 一条边 -->
                    <div class="article-section-list-item">
                        <div class="article-section-1-title">
                            一条边
                        </div>
                        <div class="article-section-1-list">
                            <!-- 圆 -->
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title">圆</div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                        <!-- 一边形：圆 -->
                                        <svg x="0px" y="0px" width="450px" height="100px" viewBox="0 0 450 100">
                                            <!-- 定义圆：<circle /> -->
                                            <circle fill="white" stroke="black" cx="80" cy="50" r="45" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            <!-- 椭圆 -->
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title">椭圆</div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                        <!-- 一边形：椭圆 -->
                                        <svg x="0px" y="0px" width="450px" height="100px" viewBox="0 0 450 100">
                                            <ellipse fill="white" stroke="black" cx="100" cy="50" rx="80" ry="40" />
                                            <!-- <circle fill="white" stroke="black" cx="170" cy="50" r="45" /> -->
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 三条边 -->
                    <div class="article-section-list-item">
                        <div class="article-section-1-title">三条边</div>
                        <div class="article-section-1-list">
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title">三角形</div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                        <!-- 三角形 -->
                                        <svg x="0px" y="0px" width="450px" height="100px" viewBox="0 0 450 100">
                                            <!-- <rect x="10" y="5" fill="white" stroke="black" width="90" height="90" /> -->
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 四条边 -->
                    <div class="article-section-list-item">
                        <div class="article-section-1-title">四条边</div>
                        <div class="article-section-1-list">
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title">长方形</div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                        <!-- 长方形 SVG -->
                                        <svg x="0px" y="0px" width="450px" height="100px" viewBox="0 0 450 100">
                                            <rect x="10" y="5" fill="white" stroke="black" width="160" height="90" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title">正方形</div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                        <!-- 正方形 SVG -->
                                        <svg x="0px" y="0px" width="450px" height="100px" viewBox="0 0 450 100">
                                            <rect x="10" y="5" fill="white" stroke="black" width="90" height="90" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title">菱形</div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                        <!-- 菱形 -->
                                        <svg x="0px" y="0px" width="450px" height="100px" viewBox="0 0 450 100">
                                            <!-- <rect x="10" y="5" fill="white" stroke="black" width="90" height="90" /> -->
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title">梯形</div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                        <!-- 菱形 -->
                                        <svg x="0px" y="0px" width="450px" height="100px" viewBox="0 0 450 100">
                                            <!-- <rect x="10" y="5" fill="white" stroke="black" width="90" height="90" /> -->
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- 立体图形 -->
            <section class="article-section">
                <div class="article-section-title">立体图形</div>
                <div class="article-section-list">
                    <!-- 正方体 -->
                    <div class="article-section-list-item">
                        <div class="article-section-1-title">正方体</div>
                        <div class="article-section-1-list">
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title"></div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 圆柱 -->
                    <div class="article-section-list-item">
                        <div class="article-section-1-title">圆柱</div>
                        <div class="article-section-1-list">
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title"></div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 圆锥 -->
                    <div class="article-section-list-item">
                        <div class="article-section-1-title">圆锥</div>
                        <div class="article-section-1-list">
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title"></div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 球 -->
                    <div class="article-section-list-item">
                        <div class="article-section-1-title">球</div>
                        <div class="article-section-1-list">
                            <div class="article-section-1-list-item">
                                <div class="article-section-2-title"></div>
                                <div class="article-section-2-list">
                                    <div class="article-section-3-item">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </article>
    </main>
</body>

</html>
